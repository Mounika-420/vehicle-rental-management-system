<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Vehicle Rental</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/styles.css"> 
    <script src="https://code.iconify.design/2/2.1.0/iconify.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Vehicle Rental Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="chatbot">Chatbot</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5" style="margin-bottom: 239px;">
        <h2 class="text-center mb-4 stylish-heading1">Admin Dashboard</h2>

        <div class="row justify-content-center">
            <div class="col-md-5 mb-4">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-body text-center">
                        <span class="iconify" data-icon="mdi:car" style="font-size: 50px; color: #007bff;"></span>
                        <h3 class="card-title mt-3">Enter Vehicle Details</h3>
                        <p class="card-text">Add new vehicle information and manage vehicle details.</p>
                        <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#vehicleModal">
                            Manage Vehicle
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-5 mb-4">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-body text-center">
                        <span class="iconify" data-icon="mdi:history" style="font-size: 50px; color: #28a745;"></span>
                        <h3 class="card-title mt-3">Booking History</h3>
                        <p class="card-text">View all past booking details and manage them accordingly.</p>
                        <a href="view_request" class="btn btn-success w-100">View History</a>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="modal fade" id="vehicleModal" tabindex="-1" aria-labelledby="vehicleModalLabel" aria-hidden="true">
        <div class="modal-dialog card">
            <div class="modal-content card">
                <div class="modal-header">
                    <h5 class="modal-title" id="vehicleModalLabel">Enter Vehicle Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="background-color: aliceblue;"></button>
                </div>
                <div class="modal-body">
                    <form id="vehicleForm" action="admin_home" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="carType" class="form-label">Vehicle Type</label>
                            <select class="form-select" id="carType" name="box1" required>
                                <option value="" disabled selected>Select Vehicle type</option>
                                <option value="bike">Bike</option>
                                <option value="car">car</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="vehiclenumber" class="form-label">Vehicle Number</label>
                            <input type="text" class="form-control" id="vehiclenumber" name="box2" placeholder="Enter Vehicle Number" required>
                        </div>
                        <div class="mb-3">
                            <label for="model" class="form-label">Model</label>
                            <input type="text" class="form-control" id="model" name="box3" placeholder="Enter car Model" required>
                        </div>
                        <div class="mb-3">
                            <label for="rentalDays" class="form-label">Rate per days</label>
                            <input type="text" class="form-control" id="rentalDays" name="box4" placeholder="Enter Rental Days" required>
                        </div>
                        <div class="mb-3">
                            <label for="carImage" class="form-label">Upload Car Image</label>
                            <input type="file" class="form-control" id="carImage" name="box5" accept="image/*" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="vehicleForm" class="btn btn-toll">Submit</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5 py-3 bg-dark text-white text-center">
        <div class="container">
            <span>© 2025 Vehicle Rental. All Rights Reserved.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
