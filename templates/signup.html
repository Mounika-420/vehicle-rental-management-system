<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Vehicle Rental</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand stylish-brand" href="#">Vehicle Rental</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="login">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="signup">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    

    <div class="container signup-container mt-5" style="margin-bottom: 74px;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 shadow">
                    <h2 class="text-center stylish-heading">Sign Up</h2>
                    <form action="/signup" method="POST">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="box1" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="box1" name="box1" placeholder="Enter your name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="box2" class="form-label">Phone Number</label>
                                <input type="text" class="form-control" id="box2" name="box2" placeholder="Enter your phone number" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="box3" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="box3" name="box3" placeholder="Enter your email" required>
                            </div>
                            <div class="col-md-6">
                                <label for="box4" class="form-label">Type</label>
                                <select class="form-select" id="box4" name="box4" required>
                                    <option value="owner">Owner</option>
                                    <option value="user">User</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="box5" class="form-label">Username</label>
                                <input type="text" class="form-control" id="box5" name="box5" placeholder="Choose a username" required>
                            </div>
                            <div class="col-md-6">
                                <label for="box6" class="form-label">Password</label>
                                <input type="password" class="form-control" id="box6" name="box6" placeholder="Create a password" required>
                            </div>
                        </div>
                        <p>{{data}}</p>
                        <button type="submit" class="btn btn-toll w-100">Sign Up</button>
                    </form>
                    <div class="text-center mt-3">
                        <p>Already have an account? <a href="login" class="link">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-auto py-3 text-center">
        <div class="container">
            <span>© 2025 Vehicle Rental. All Rights Reserved.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
