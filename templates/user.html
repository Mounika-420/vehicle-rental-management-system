<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User - Vehicle Rental</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/styles.css"> 
    <script src="https://code.iconify.design/2/2.1.0/iconify.min.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Vehicle Rental</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="chatbot">Chatbot</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5" style="margin-bottom: 239px;">
        <h2 class="text-center mb-4 stylish-heading1">View Available Vehicles</h2>

        <div class="row justify-content-center">
            {% for i in data %}
            <div class="col-md-4 mb-4">
                <div class="card shadow-lg border-0 rounded-3">
                    <img src="/static/upload/{{i[5]}}" class="card-img-top" alt="Vehicle Image">
                    <div class="card-body text-center">
                        <h3 class="card-title mt-3">{{ i[1] }}</h3>
                        <p class="card-text">{{ i[2] }} | {{ i[3] }} | Registration No: {{ i[4] }}</p>
                        <button type="button" class="btn btn-success w-100" data-bs-toggle="modal" onclick="populateModal('{{i[0]}}','{{i[3]}}')" data-bs-target="#bookingModal">
                        Book Now
                    </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="bookingModalLabel" aria-hidden="true">
        <div class="modal-dialog card">
            <div class="modal-content card">
                <div class="modal-header">
                    <h5 class="modal-title" id="bookingModalLabel">Book Vehicle</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="bookingForm" action="add_book" method="post">
                        <input type="hidden"   name="id" id="id">
                        <div class="mb-3">
                            <label for="vehicleName" class="form-label">Vehicle Name</label>
                            <input type="text" class="form-control text-dark" id="name" name="box2">
                        </div>
                        <div class="mb-3">
                            <label for="bookingDate" class="form-label">Booking Date</label>
                            <input type="date" class="form-control" id="bookingDate" name="box3" required>
                        </div>
                        <div class="mb-3">
                            <label for="duration" class="form-label">Booking Duration (days)</label>
                            <input type="number" class="form-control" id="duration" name="box4" min="1" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" form="bookingForm" class="btn btn-primary" >Book Now</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer mt-5 py-3 bg-dark text-white text-center">
        <div class="container">
            <span>© 2025 Vehicle Rental. All Rights Reserved.</span>
        </div>
    </footer>
    <script>
        function populateModal(id,name) {
            document.getElementById("id").value = id;
            document.getElementById("name").value = name;
           
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
